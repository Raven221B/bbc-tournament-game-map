<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBC Mini Fun Game | Live Results · H2H-R5 · 35-Point Compatible Round Robin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1422;color:#edf4fc;font:15px/1.5 system-ui,sans-serif}header{background:#142c39;padding:24px;border-bottom:1px solid #38535b}main,header>div{max-width:1300px;margin:auto}main{padding:18px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}small,.muted{color:#a9b9cc}button,input,select{font:inherit;border:1px solid #405367;border-radius:8px;padding:9px;background:#142538;color:#fff}button{cursor:pointer;font-weight:650}button.primary,button.active{background:#78e8ad;color:#102b22;border-color:#78e8ad}button.danger{color:#ffabab}button:disabled{opacity:.4;cursor:default}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.panel{background:#152235;border:1px solid #304158;border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.medal{background:#1b2d42;border:1px solid #405367;padding:14px;border-radius:10px;overflow-wrap:anywhere}.medal b{display:block;color:#f2d084}.match{border:1px solid #34485e;border-radius:10px;padding:12px;margin:9px 0}.pair{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center;margin:7px 0}.pair input{width:82px;text-align:center;font-weight:bold}.win{color:#78e8ad}.loss{color:#ffaaaa}.warn{color:#ffcb7d}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:470px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid #304158}th{color:#a9b9cc;font-size:12px}.roster{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin:8px 0}.roster input,.roster select{min-width:0;width:100%}.map{overflow:auto}.map svg{min-width:920px;width:100%;display:block}label{font-size:13px}.stat{font-size:12px;color:#a9b9cc}@media(max-width:800px){.grid{grid-template-columns:1fr}.roster{grid-template-columns:1fr 1fr}.podium{grid-template-columns:1fr}main{padding:10px}}
.settable{min-width:430px}.settable input{width:55px;padding:7px;text-align:center}.settable td:first-child{min-width:105px}.settable input:disabled{opacity:.3}.grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.match table{min-width:390px}.match td:not(:first-child),.match th:not(:first-child){text-align:center}.status{margin:10px 0}.empty{padding:20px;color:#a9b9cc}.map svg{min-width:750px}button:focus-visible{outline:2px solid #78e8ad}</style></head><body><header><div><small>BBC MINI FUN GAME · PUBLIC LIVE RESULTS · H2H-R5 ADAPTIVE ROUND ROBIN</small><h1>Badminton Game Map</h1><p>Live match results · Automatic podium · Read-only</p></div></header><main><section class="panel"><div class="row"><button id="refresh">Refresh results</button><span id="status" role="status" aria-live="polite">Connecting to live results…</span></div><small>Updates automatically. Only published results are displayed.</small></section><nav id="tabs"></nav><section id="content" class="panel">Waiting for tournament data…</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>[["",""],["",""],["",""]];let target=21;let data=[],active=0;function pname(c,id){const p=c.pairs.find(p=>p.id===id);return p?p.a+' / '+p.b:'Pending';}const setValid=(s,t)=>Array.isArray(s)&&s.length===2&&s.every(v=>v!==''&&/^\d+$/.test(String(v))&&+v<=t)&&Math.max(...s.map(Number))===t&&+s[0]!==+s[1];
function result(m){const sets=m.s,w=[0,0],p=[0,0];let count=0;for(let i=0;i<3;i++){if(i===2&&(w[0]!==1||w[1]!==1))break;if(!setValid(sets[i],target))break;const a=+sets[i][0],b=+sets[i][1];w[a>b?0:1]++;p[0]+=a;p[1]+=b;count++;}return {w,p,count,done:w[0]===2||w[1]===2,third:w[0]===1&&w[1]===1||count===3};}
const valid=m=>!!m&&!!m.a&&!!m.b&&!m.bye&&result(m).done;const winner=m=>valid(m)?(result(m).w[0]===2?m.a:m.b):null;const compare=(a,b)=>b.w-a.w||b.d-a.d||b.pf-a.pf;
function stats(c,ms,ids=c.pairs.map(p=>p.id)){const t=ids.map(id=>({id,w:0,l:0,sw:0,sl:0,pf:0,pa:0,d:0}));for(const m of ms.filter(valid)){const a=t.find(t=>t.id===m.a),b=t.find(t=>t.id===m.b);if(!a||!b)continue;const {p,w}=result(m);a.pf+=p[0];a.pa+=p[1];b.pf+=p[1];b.pa+=p[0];a.sw+=w[0];a.sl+=w[1];b.sw+=w[1];b.sl+=w[0];if(w[0]===2){a.w++;b.l++}else{b.w++;a.l++}}t.forEach(t=>t.d=t.pf-t.pa);return t.sort(compare)}function ranking(c){
 if(c.formatVersion===4&&c.pairs.length>=4){const base=stats(c,c.m),f=c.m.find(m=>m.stage==='final'),b=c.m.find(m=>m.stage==='bronze'),pod=[winner(f),loser(f||{}),winner(b)];const rows=pod.map((id,i)=>id?{...base.find(t=>t.id===id),rank:i+1,ready:true}:{id:null,rank:i+1,ready:false});return {rows,done:pod.every(Boolean),blocks:[]};}

 const base=stats(c,c.m),done=c.m.length>0&&c.m.every(valid),rows=[],blocks=[];
 const chunks=(arr,cmp)=>{const out=[];for(const t of arr){if(!out.length||cmp(out.at(-1)[0],t)!==0)out.push([t]);else out.at(-1).push(t);}return out;};
 const emit=(ids,rank,ready)=>ids.forEach((id,i)=>rows.push({...base.find(t=>t.id===id),rank:ready?rank+i:rank,ready}));
 const direct=(ms,ids)=>{const games=ms.filter(m=>valid(m)&&ids.includes(m.a)&&ids.includes(m.b));const wins=ids.map(id=>games.filter(m=>winner(m)===id).length);return wins[0]===wins[1]?null:wins[0]>wins[1]?[ids[0],ids[1]]:[ids[1],ids[0]];};
 function playoff(ids,rank,round){
  const signature=ids.slice().sort().join('|');
  let ms=c.extra.filter(m=>(m.tbRound||1)===round&&(!m.tbGroup||m.tbGroup===signature)&&ids.includes(m.a)&&ids.includes(m.b));
  const required=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j];let m=ms.find(m=>[m.a,m.b].includes(a)&&[m.a,m.b].includes(b));if(!valid(m))required.push([a,b]);}
  if(required.length){blocks.push({ids,required,resolved:false,round});emit(ids,rank,false);return;}
  const e=stats(c,ms,ids); let offset=rank;
  for(const g of chunks(e,(a,b)=>b.w-a.w)){
   const members=g.map(t=>t.id);
   if(g.length===1)emit(members,offset,true);
   else if(g.length===2&&direct(ms,members))emit(direct(ms,members),offset,true);
   else {let pos=offset;for(const k of chunks(g,compare)){const sub=k.map(t=>t.id);if(sub.length===1)emit(sub,pos,true);else playoff(sub,pos,round+1);pos+=sub.length;}}
   offset+=g.length;
  }
  blocks.push({ids,required:[],resolved:!rows.some(t=>ids.includes(t.id)&&!t.ready),round});
 }
 if(!done){base.forEach((t,i)=>emit([t.id],i+1,false));return {rows,done,blocks};}
 let rank=1;for(const g of chunks(base,(a,b)=>b.w-a.w)){
  const ids=g.map(t=>t.id);
  if(g.length===1)emit(ids,rank,true);
  else if(g.length===2&&direct(c.m,ids))emit(direct(c.m,ids),rank,true);
  else {let pos=rank;for(const k of chunks(g,compare)){const sub=k.map(t=>t.id);if(sub.length===1)emit(sub,pos,true);else playoff(sub,pos,1);pos+=sub.length;}}
  rank+=g.length;
 }return {rows,done,blocks};}

function loser(m){const w=winner(m);return w?(w===m.a?m.b:m.a):null;}
function advanceWinner(m){return m.bye?(m.a||m.b):winner(m);}
function visual(c,r){const all=[...c.m,...c.extra],h=Math.max(320,all.length*76+45),mid=h/2;const text=(x,y,t,col='#edf4fc',size=13)=>`<text x="${x}" y="${y}" fill="${col}" font-size="${size}">${esc(t)}</text>`;let lines='',nodes='';all.forEach((m,i)=>{const y=33+i*76,w=winner(m);lines+=`<path d="M290 ${y+28} H320 V${mid} H350" fill="none" stroke="#506c86"/>`;nodes+=`<rect x="8" y="${y}" width="282" height="65" rx="7" fill="#1b2d42" stroke="#405367"/>`+text(17,y+14,i<c.m.length?'Match '+(i+1):'Tie-break '+(i-c.m.length+1),'#a9b9cc',10)+[m.a,m.b].map((id,j)=>text(17,y+33+j*18,pname(c,id),w?(w===id?'#78e8ad':'#ffaaaa'):undefined)+text(260,y+33+j*18,valid(m)?result(m).p[j]+' pts':'—')).join('');});const ry=mid-25-r.rows.length*10;nodes+=`<rect x="350" y="${ry}" width="285" height="${45+r.rows.length*23}" rx="8" fill="#1b2d42" stroke="#405367"/>`+text(360,ry+19,'Standings · '+(r.done?'completed':'provisional'),'#a9b9cc')+r.rows.map((t,i)=>text(360,ry+42+i*23,(t.ready?'#'+t.rank:'—')+' '+pname(c,t.id)+'  '+t.w+'–'+t.l,t.ready?'#78e8ad':undefined)).join('');for(let i=0;i<3;i++){let row=r.rows[i],y=mid-110+i*76;lines+=`<path d="M635 ${mid} H660 V${y+25} H690" fill="none" stroke="${row?.ready?'#78e8ad':'#506c86'}"/>`;nodes+=`<rect x="690" y="${y}" width="260" height="60" rx="8" fill="#1b2d42" stroke="#405367"/>`+text(700,y+20,['1st place','2nd place','3rd place'][i],'#f2d084')+text(700,y+42,row?.ready?pname(c,row.id):'Pending');}return `<div class="map"><svg viewBox="0 0 970 ${h}" role="img" aria-label="Tournament progression">${text(8,18,'MATCH RESULTS','#a9b9cc',11)}${text(350,18,'RANKINGS','#a9b9cc',11)}${text(690,18,'PODIUM','#a9b9cc',11)}${lines}${nodes}</svg></div>`;}
function knockoutMap(c){const max=Math.max(...c.m.map(m=>m.r)), h=Math.max(320, c.m.filter(m=>m.r===1).length*100+150),width=(max+1)*300;const pos=new Map();for(const m of c.m){const j=+m.id.split('-')[1]||0;pos.set(m.id,{x:15+(m.r-1)*300,y:m.stage==='bronze'?h-87:35+(j+.5)*100*2**(m.r-1)-40});}let lines='',nodes='';for(const m of c.m){const {x,y}=pos.get(m.id);for(const id of m.sources||[]){if(!id)continue;const p=pos.get(id);lines+=`<path d="M${p.x+260} ${p.y+38} H${x-20} V${y+38} H${x}" fill="none" stroke="${m.stage==='bronze'?'#ffaaaa':'#78e8ad'}"/>`;}const w=advanceWinner(m);nodes+=`<rect x="${x}" y="${y}" width="260" height="76" rx="7" fill="#1b2d42" stroke="#405367"/><text x="${x+9}" y="${y+15}" fill="#a9b9cc" font-size="11">${esc(m.stage.toUpperCase())} · ${esc(m.id)}</text>${[m.a,m.b].map((id,i)=>`<text x="${x+9}" y="${y+36+i*21}" font-size="12" fill="${w&&id===w?'#78e8ad':w&&id?'#ffaaaa':'#edf4fc'}">${esc(id?pname(c,id):m.bye?'BYE':'Pending')} ${valid(m)?' · '+result(m).w[i]+' sets':''}</text>`).join('')}`;}return `<div class="map"><svg viewBox="0 0 ${width} ${h}" role="img" aria-label="Elimination bracket">${lines}${nodes}</svg></div>`;}

function isKO(c){return c.formatVersion===4&&c.pairs.length>=4;}
function format(c){if(c.formatVersion===5)return c.pairs.length===3?'Double round robin':c.pairs.length>=4?'Single round robin':'Insufficient pairs for three placements';return c.formatVersion!==4?'Legacy round robin (before migration)':c.pairs.length===3?'Double round robin (R4)':isKO(c)?'Single elimination (R4 — awaiting migration)':'Insufficient pairs for three placements';}
function matchView(c,m,i,extra=false){const label=extra?'Tie-break round '+(m.tbRound||1)+' · Match '+(i+1):(m.stage?m.stage.toUpperCase()+' · '+m.id:'Round '+m.r+' · Match '+(i+1));if(m.bye)return `<div class="match"><small>${esc(label)}</small><p class="win">${esc(pname(c,m.a||m.b))} advances automatically · BYE</p></div>`;if(!m.a||!m.b)return `<div class="match"><small>${esc(label)}</small><p>${esc(pname(c,m.a))} vs ${esc(pname(c,m.b))}</p><small>Awaiting previous results</small></div>`;const r=result(m),w=winner(m);return `<div class="match"><small>${esc(label)}</small><div class="scroll"><table><thead><tr><th>Pair</th><th>Set 1 (${target})</th><th>Set 2 (${target})</th><th>Set 3 (${target})</th><th>Points</th><th>Sets won</th></tr></thead><tbody>${[m.a,m.b].map((id,j)=>`<tr><td class="${w?(w===id?'win':'loss'):''}"><b>${esc(pname(c,id))}</b></td>${m.s.map((set,k)=>`<td>${k===2&&!r.third?'—':esc(set[j]===''?'—':set[j])}</td>`).join('')}<td>${r.p[j]}</td><td>${r.w[j]}</td></tr>`).join('')}</tbody></table></div><small class="${w?'win':'muted'}">${w?'Winner: '+esc(pname(c,w)):'Pending / in progress'}</small></div>`;}
function render(){if(!data.length){$('tabs').innerHTML='';$('content').innerHTML='No published tournament data yet.';return;}active=Math.min(active,data.length-1);const c=data[active],ko=isKO(c),r=ranking(c),playable=c.m.filter(m=>!m.bye);$('tabs').innerHTML=data.map((t,i)=>`<button data-cat="${i}" class="${active===i?'active':''}">${esc(t.name)} · ${t.pairs.length}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=Number(b.dataset.cat);render();});const podium=[1,2,3].map((rank,i)=>{const t=r.rows.find(t=>t.rank===rank&&t.ready);return `<div class="medal"><b>${['🥇 1st','🥈 2nd','🥉 3rd'][i]} Place</b>${t?esc(pname(c,t.id)):'Pending'}</div>`}).join('');const tie=stats(c,c.extra);$('content').className='';$('content').innerHTML=`<section class="panel"><h2>${esc(c.name)}</h2><p class="muted">${esc(format(c))} · ${c.pairs.length} pairs · ${playable.filter(valid).length}/${playable.length} matches completed</p><div class="podium">${podium}</div></section><div class="${ko?'':'grid'}"><section class="panel"><h2>Match results</h2>${c.m.map((m,i)=>matchView(c,m,i)).join('')||'No matches'}</section>${ko?'':`<div><section class="panel"><h2>Automatic standings</h2><div class="scroll"><table><thead><tr><th>Rank</th><th>Pair</th><th>W–L</th><th>Sets W–L</th><th>PF</th><th>PA</th><th>+/−</th></tr></thead><tbody>${r.rows.map(t=>`<tr><td>${t.rank}${t.ready?'':'*'}</td><td>${esc(pname(c,t.id))}</td><td>${t.w}–${t.l}</td><td>${t.sw}–${t.sl}</td><td>${t.pf}</td><td>${t.pa}</td><td>${t.d>0?'+':''}${t.d}</td></tr>`).join('')}</tbody></table></div><p class="muted">* Provisional or unresolved. Wins → aggregate original H2H for two-way ties → point difference → points scored → additional tie-break rounds.</p>${r.blocks.filter(b=>!b.resolved).map(b=>`<p class="warn">Tie-break round ${b.round}: ${b.ids.map(id=>esc(pname(c,id))).join(', ')} · ${b.required.length} result(s) pending</p>`).join('')}</section><section class="panel"><h2>Head-to-head tie-break matches</h2>${c.extra.map((m,i)=>matchView(c,m,i,true)).join('')||'<p class="muted">No published additional matches.</p>'}</section></div>`}</div><section class="panel"><h2>${ko?'Live elimination bracket':'Live visual game map'}</h2>${ko?knockoutMap(c):visual(c,r)}</section>`;}
const db=window.supabase?.createClient('https://vcshzqjozgzsgaknsjzq.supabase.co','sb_publishable_PFxb5Crp0VaeStU9hosP2g_E-SIDyqs',{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
let busy=false,revision=null;async function refresh(){if(busy)return;busy=true;try{if(!db)throw Error('Live connection library unavailable');const {data:row,error}=await db.from('tournament_state').select('data,target,revision').eq('id','bbc-tournament').single();if(error)throw error;if(!Array.isArray(row.data)||!row.data.every(c=>typeof c.name==='string'&&Array.isArray(c.pairs)&&Array.isArray(c.m)&&Array.isArray(c.extra)))throw Error('Unexpected tournament data');if(revision!==row.revision||!data.length){data=row.data;target=row.target===15?15:21;render();revision=row.revision;}$('status').textContent='Live · revision '+revision+' · checked '+new Date().toLocaleTimeString();}catch(e){$('status').textContent='Unable to refresh: '+e.message+(data.length?' · showing last loaded results':'');}finally{busy=false;}}
$('refresh').onclick=refresh;refresh();if(db)db.channel('bbc-public-r4').on('postgres_changes',{event:'UPDATE',schema:'public',table:'tournament_state',filter:'id=eq.bbc-tournament'},refresh).subscribe();setInterval(refresh,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
