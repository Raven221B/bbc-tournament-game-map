.settable{min-width:430px}.settable input{width:55px;padding:7px;text-align:center}.settable td:first-child{min-width:105px}.settable input:disabled{opacity:.3}.grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><header><div><small>BBC MINI FUN GAME · MATCH CONTROL</small><h1>Badminton Game Map</h1><p>Round robin · Automatic tie-breaks · Three winners per category</p></div></header><main><nav id="tabs"></nav><div class="row"><button id="edit">Edit names & levels</button><button id="export">Export backup</button><button id="import">Import backup</button><input type="file" id="file" accept=".json" hidden><button id="reset" class="danger">Reset category scores</button></div><section id="roster" class="panel" hidden></section><section id="content"></section><p class="muted">Local browser app. Use backups to preserve results or transfer to another device. Controller tools are not password protected.</p></main><script>
const roster=[['Men’s Doubles – Advanced',[['Lian','Benjie'],['Yap','Aries'],['Tristan','Dem'],['Eng','Odie']]],['Men’s Doubles – Intermediate',[['Charle','Adrian'],['Gerald','Lemuel'],['Jeremy','Darnz'],['Nass','Jheken']]],['MXD',[['Mark','Yvette'],['Angelo','Clarisse'],['Cholo','Chrizle']]],['Intermediate',[['Luigi','Othan'],['Isaac','Carlo'],['Aaron','Jan Ray'],['Vlad','Lani'],['Yohan','Axel']]],['Novice',[['Adel','Rechell'],['Pauwy','Nooky'],['Lucy','Grace']]]];
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key='bbc-roster-20261117-sets-v2';let uid=0,active=0;const newid=()=> 'p'+Date.now().toString(36)+'_'+(++uid);function fixtures(pairs,old=[]){const n=pairs.length;if(n<2)return [];const a=pairs.map(p=>p.id);if(n%2)a.push(null);const rotation=[...a.filter((_,i)=>i%2===0),...a.filter((_,i)=>i%2===1).reverse()];const res=[];for(let r=0;r<rotation.length-1;r++){for(let i=0;i<rotation.length/2;i++){let x=rotation[i],y=rotation[rotation.length-1-i];if(!x||!y)continue;const prev=old.find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x));res.push({a:x,b:y,r:r+1,s:prev?prev.s.map(set=>prev.a===x?[...set]:[...set].reverse()):blank()});}rotation.splice(1,0,rotation.pop());}return res;}
const blank=()=>[["",""],["",""],["",""]];let target=21;try{target=Number(localStorage.getItem(key+"-target"))===15?15:21}catch{}function init(){return roster.map(([name,ps],i)=>{const pairs=ps.map(([a,b],j)=>({id:`c${i}p${j}`,a,b}));return {name,pairs,m:fixtures(pairs),extra:[]};});}let data=init();try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)&&v.length===5)data=v;}catch{}function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{}}const cat=()=>data[active];function pname(c,id){const p=c.pairs.find(p=>p.id===id);return p?p.a+' / '+p.b:'Pending';}const setValid=(s,t)=>Array.isArray(s)&&s.length===2&&s.every(v=>v!==''&&/^\d+$/.test(String(v))&&+v<=t)&&Math.max(...s.map(Number))===t&&+s[0]!==+s[1];
function result(m){const sets=m.s,w=[0,0],p=[0,0];let count=0;for(let i=0;i<3;i++){if(i===2&&(w[0]!==1||w[1]!==1))break;if(!setValid(sets[i],i===2?target:21))break;const a=+sets[i][0],b=+sets[i][1];w[a>b?0:1]++;p[0]+=a;p[1]+=b;count++;}return {w,p,count,done:w[0]===2||w[1]===2,third:w[0]===1&&w[1]===1||count===3};}
const valid=m=>!!m&&result(m).done;const winner=m=>valid(m)?(result(m).w[0]===2?m.a:m.b):null;const compare=(a,b)=>b.w-a.w||b.d-a.d||b.pf-a.pf;
function stats(c,ms,ids=c.pairs.map(p=>p.id)){const t=ids.map(id=>({id,w:0,l:0,sw:0,sl:0,pf:0,pa:0,d:0}));for(const m of ms.filter(valid)){const a=t.find(t=>t.id===m.a),b=t.find(t=>t.id===m.b);if(!a||!b)continue;const {p,w}=result(m);a.pf+=p[0];a.pa+=p[1];b.pf+=p[1];b.pa+=p[0];a.sw+=w[0];a.sl+=w[1];b.sw+=w[1];b.sl+=w[0];if(w[0]===2){a.w++;b.l++}else{b.w++;a.l++}}t.forEach(t=>t.d=t.pf-t.pa);return t.sort(compare)}function ranking(c,generate=false){
 const base=stats(c,c.m),done=c.m.length>0&&c.m.every(valid),rows=[],blocks=[];
 const chunks=(arr,cmp)=>{const out=[];for(const t of arr){if(!out.length||cmp(out.at(-1)[0],t)!==0)out.push([t]);else out.at(-1).push(t);}return out;};
 const emit=(ids,rank,ready)=>ids.forEach((id,i)=>rows.push({...base.find(t=>t.id===id),rank:ready?rank+i:rank,ready}));
 const direct=(ms,ids)=>{const m=ms.find(m=>valid(m)&&ids.includes(m.a)&&ids.includes(m.b));return m?[winner(m),ids.find(id=>id!==winner(m))]:null;};
 function playoff(ids,rank,round){
  const signature=ids.slice().sort().join('|');
  let ms=c.extra.filter(m=>(m.tbRound||1)===round&&(!m.tbGroup||m.tbGroup===signature)&&ids.includes(m.a)&&ids.includes(m.b));
  const required=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=ids[i],b=ids[j];let m=ms.find(m=>[m.a,m.b].includes(a)&&[m.a,m.b].includes(b));if(!m&&generate){m={a,b,s:blank(),tbRound:round,tbGroup:signature};c.extra.push(m);ms.push(m);}if(!valid(m))required.push([a,b]);}

   else if(g.length===2&&direct(ms,members))emit(direct(ms,members),offset,true);
   else {let pos=offset;for(const k of chunks(g,compare)){const sub=k.map(t=>t.id);if(sub.length===1)emit(sub,pos,true);else playoff(sub,pos,round+1);pos+=sub.length;}}
   offset+=g.length;

 }
 if(!done){base.forEach((t,i)=>emit([t.id],i+1,false));return {rows,done,blocks};}

  rank+=g.length;
 }return {rows,done,blocks};}
function autoExtra(c){const n=c.extra.length;ranking(c,true);if(c.extra.length!==n)save();}
function tieStats(c,r){const ids=[...new Set(c.extra.flatMap(m=>[m.a,m.b]))];return stats(c,c.extra,ids);}
function match(c,m,i,extra=false){const w=winner(m),r=result(m),third=r.third;return `<div class="match"><small>${extra?'Tie-break round '+(m.tbRound||1)+' · Match':'Round '+m.r+' · Match'} ${i+1}</small><div class="scroll"><table class="settable"><thead><tr><th>Pair</th><th>Set 1<br>21 pts</th><th>Set 2<br>21 pts</th><th>Set 3<br>${target} pts</th><th>Total</th><th>Sets won</th></tr></thead><tbody>${[m.a,m.b].map((id,j)=>`<tr><td class="${w?(w===id?'win':'loss'):''}"><b>${esc(pname(c,id))}</b></td>${m.s.map((set,k)=>`<td><input aria-label="${esc(pname(c,id))} set ${k+1}" type="number" min="0" max="${k===2?target:21}" step="1" placeholder="—" value="${esc(set[j])}" ${k===2&&!third?'disabled':''} id="score-${extra}-${i}-${k}-${j}" oninput="score(${extra},${i},${k},${j},this.value)"></td>`).join('')}<td><b>${r.p[j]}</b></td><td>${r.w[j]}</td></tr>`).join('')}</tbody></table></div><small class="${w?'win':'warn'}">${w?'Winner: '+esc(pname(c,w))+' · '+Math.max(...r.w)+'–'+Math.min(...r.w)+' sets':third?'Third set required':'Enter both 21-point set results'}</small>${extra?` <button class="danger" onclick="removeExtra(${i})">Correct match score</button>`:''}</div>`;}
function visual(c,r){const all=[...c.m,...c.extra],h=Math.max(320,all.length*76+45),mid=h/2;const text=(x,y,t,col='#edf4fc',size=13)=>`<text x="${x}" y="${y}" fill="${col}" font-size="${size}">${esc(t)}</text>`;let lines='',nodes='';all.forEach((m,i)=>{const y=33+i*76,w=winner(m);lines+=`<path d="M290 ${y+28} H320 V${mid} H350" fill="none" stroke="#506c86"/>`;nodes+=`<rect x="8" y="${y}" width="282" height="65" rx="7" fill="#1b2d42" stroke="#405367"/>`+text(17,y+14,i<c.m.length?'Match '+(i+1):'Tie-break '+(i-c.m.length+1),'#a9b9cc',10)+[m.a,m.b].map((id,j)=>text(17,y+33+j*18,pname(c,id),w?(w===id?'#78e8ad':'#ffaaaa'):undefined)+text(260,y+33+j*18,valid(m)?result(m).p[j]+' pts':'—')).join('');});const ry=mid-25-r.rows.length*10;nodes+=`<rect x="350" y="${ry}" width="285" height="${45+r.rows.length*23}" rx="8" fill="#1b2d42" stroke="#405367"/>`+text(360,ry+19,'Standings · '+(r.done?'completed':'provisional'),'#a9b9cc')+r.rows.map((t,i)=>text(360,ry+42+i*23,(t.ready?'#'+t.rank:'—')+' '+pname(c,t.id)+'  '+t.w+'–'+t.l,t.ready?'#78e8ad':undefined)).join('');for(let i=0;i<3;i++){let row=r.rows[i],y=mid-110+i*76;lines+=`<path d="M635 ${mid} H660 V${y+25} H690" fill="none" stroke="${row?.ready?'#78e8ad':'#506c86'}"/>`;nodes+=`<rect x="690" y="${y}" width="260" height="60" rx="8" fill="#1b2d42" stroke="#405367"/>`+text(700,y+20,['1st place','2nd place','3rd place'][i],'#f2d084')+text(700,y+42,row?.ready?pname(c,row.id):'Pending');}return `<div class="map"><svg viewBox="0 0 970 ${h}" role="img" aria-label="Tournament progression">${text(8,18,'MATCH RESULTS','#a9b9cc',11)}${text(350,18,'RANKINGS','#a9b9cc',11)}${text(690,18,'PODIUM','#a9b9cc',11)}${lines}${nodes}</svg></div>`;}
function render(){const c=cat();autoExtra(c);const r=ranking(c),tb=tieStats(c,r);$('tabs').innerHTML=data.map((t,i)=>`<button class="${active===i?'active':''}" onclick="switchCat(${i})">${esc(t.name)} · ${t.pairs.length}</button>`).join('');const eligible=r.done?r.blocks.filter(b=>!b.resolved).flatMap(b=>b.ids):[];const opts=eligible.map(id=>`<option value="${id}">${esc(pname(c,id))}</option>`).join('');$('content').innerHTML=`<div class="panel"><h2>${esc(c.name)}</h2><p class="muted">${c.pairs.length} pairs · ${c.m.filter(valid).length}/${c.m.length} matches completed</p><div class="podium">${[0,1,2].map(i=>`<div class="medal"><b>${['🥇 1st','🥈 2nd','🥉 3rd'][i]} Place</b>${r.rows[i]?.ready?esc(pname(c,r.rows[i].id)):'Pending'}</div>`).join('')}</div></div><div class="grid"><section class="panel"><h2>Set-by-set tabulation board</h2><p class="muted">Enter scores directly in each box. No deuce: 21–20 is valid; 21–21 is not. Third set unlocks automatically after one set win each. Only completed matches count in standings.</p><label>Third set target <select onchange="changeTarget(this.value)"><option value="21" ${target===21?'selected':''}>21 points</option><option value="15" ${target===15?'selected':''}>15 points</option></select></label>${c.m.map((m,i)=>match(c,m,i)).join('')||'Not enough pairs'}</section><div><section class="panel"><h2>Automatic standings</h2><div class="scroll"><table><thead><tr><th>Rank</th><th>Pair</th><th>Matches W–L</th><th>Sets W–L</th><th>PF</th><th>PA</th><th>+/−</th><th>H2H W–L</th><th>H2H Sets W–L</th><th>H2H PF</th><th>H2H PA</th><th>H2H +/−</th></tr></thead><tbody>${r.rows.map(t=>`<tr><td>${t.rank}${t.ready?'':'*'}</td><td>${esc(pname(c,t.id))}</td><td>${t.w}–${t.l}</td><td>${t.sw}–${t.sl}</td><td>${t.pf}</td><td>${t.pa}</td><td class="${t.d>0?'win':t.d<0?'loss':''}">${t.d>0?'+':''}${t.d}</td>${(()=>{const e=tb.find(x=>x.id===t.id);return e?`<td>${e.w}–${e.l}</td><td>${e.sw}–${e.sl}</td><td>${e.pf}</td><td>${e.pa}</td><td class="${e.d>0?'w function switchCat(i){active=i;render()}function changeTarget(v){if(data.some(c=>[...c.m,...c.extra].some(m=>m.s[2].some(x=>x!=='')))){alert('Clear third-set scores before changing the target.');render();return;}target=Number(v);try{localStorage.setItem(key+'-target',target)}catch{}render()}
function score(extra,i,k,j,v){if(v!==''&&(!/^\d+$/.test(v)||+v>(k===2?target:21))){const el=document.getElementById(`score-${extra}-${i}-${k}-${j}`);el.value=(extra?cat().extra:cat().m)[i].s[k][j];return;}const c=cat(),m=(extra?c.extra:c.m)[i];if(extra&&m.s[k][j]!==v&&c.extra.some(x=>(x.tbRound||1)>(m.tbRound||1))){if(!confirm('Correcting this score invalidates later tie-break rounds. Continue?')){render();return;}c.extra=c.extra.filter(x=>(x.tbRound||1)<=(m.tbRound||1));}if(!extra&&c.extra.length&&m.s[k][j]!==v){if(!confirm('Changing regular results clears tie-break matches. Continue?')){render();return;}c.extra=[];}m.s[k][j]=v;if(k<2&&!result(m).third)m.s[2]=['',''];save();render();const next=document.getElementById(`score-${extra}-${i}-${k}-${j}`);if(next){next.focus({preventScroll:true});const old=next.value;next.value="";next.value=old;}}
function addExtra(){const c=cat(),a=$('ta').value,b=$('tb').value;if(a===b||!ranking(c).blocks.some(t=>!t.resolved&&t.ids.includes(a)&&t.ids.includes(b)))return alert('Select two different pairs in the same tie.');if(c.extra.some(m=>[m.a,m.b].includes(a)&&[m.a,m.b].includes(b)))return alert('Match already exists. Remove it first to schedule a replay.');c.extra.push({a,b,s:blank()});save();render()}function removeExtra(i){if(confirm('Clear this tie-break score for a replay?')){const c=cat(),m=c.extra[i];c.extra=c.extra.filter(x=>(x.tbRound||1)<=(m.tbRound||1));m.s=blank();save();render()}}
function renderRoster(){const c=cat();$('roster').innerHTML=`<h2>Match Controller · Roster</h2><div class="row"><input id="levelname" value="${esc(c.name)}" aria-label="Level name"><button onclick="renameLevel()">Save level name</button></div>${c.pairs.map((p,i)=>`<div class="roster"><input id="a${i}" value="${esc(p.a)}" aria-label="Player 1"><input id="b${i}" value="${esc(p.b)}" aria-label="Player 2"><select id="dest${i}" aria-label="Level">${data.map((d,j)=>`<option value="${j}" ${j===active?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button onclick="editPair(${i})">Save pair</button><button class="danger" onclick="removePair(${i})">Remove pair</button></div>`).join('')}<div class="row"><input id="newa" placeholder="Player 1"><input id="newb" placeholder="Player 2"><button class="primary" onclick="addPair()">+ Add pair</button></div><small>Renaming preserves results. Roster changes preserve regular scores between remaining pairs but clear affected tie-break matches.</small>`;}
function renameLevel(){const n=$('levelname').value.trim();if(!n||data.some((d,i)=>i!==active&&d.name.toLowerCase()===n.toLowerCase()))return alert('Enter a unique level name.');cat().name=n;save();render()}function rebuild(c){c.m=fixtures(c.pairs,c.m);c.extra=[];}function editPair(i){const c=cat(),a=$('a'+i).value.trim(),b=$('b'+i).value.trim(),d=+$('dest'+i).value;if(!a||!b)return alert('Enter both names.');if(d!==active&&!confirm('Transfer pair? Affected tie-break matches will clear.'))return;Object.assign(c.pairs[i],{a,b});if(d!==active){data[d].pairs.push(c.pairs.splice(i,1)[0]);rebuild(c);rebuild(data[d]);}save();render()}function removePair(i){const c=cat();if(!confirm('Remove '+pname(c,c.pairs[i].id)+' and its matches? Remaining scores will be retained. '+(c.pairs.length<=3?'Fewer than three pairs will remain.':'')))return;c.pairs.splice(i,1);rebuild(c);save();render()}function addPair(){const a=$('newa').value.trim(),b=$('newb').value.trim();if(!a||!b)return alert('Enter both players.');const c=cat();if(c.extra.length&&!confirm('Adding a pair clears tie-break matches. Continue?'))return;c.pairs.push({id:newid(),a,b});rebuild(c);save();render()}
$('edit').onclick=()=>{$('roster').hidden=!$('roster').hidden;if(!$('roster').hidden)renderRoster()};$('reset').onclick=()=>{if(confirm('Clear scores in '+cat().name+'?')){cat().m=fixtures(cat().pairs);cat().extra=[];save();render()}};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({target,data},null,2)],{type:'application/json'}));a.download='BBC-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let backup=JSON.parse(await $('file').files[0].text());let d=backup.data;if(!Array.isArray(d)||d.length!==5||!d.every(c=>typeof c.name==='string'&&Array.isArray(c.pairs)&&Array.isArray(c.m)&&Array.isArray(c.extra)&&c.pairs.every(p=>typeof p.id==='string'&&typeof p.a==='string'&&typeof p.b==='string')&&[...c.m,...c.extra].every(m=>Array.isArray(m.s)&&m.s.length===3&&m.s.every(set=>Array.isArray(set)&&set.length===2))))throw Error();if(confirm('Replace current tournament data with backup?')){data=d;target=backup.target===15?15:21;try{localStorage.setItem(key+'-target',target)}catch{}save();render()}}catch{alert('Invalid backup file.')} $('file').value=''};render();
